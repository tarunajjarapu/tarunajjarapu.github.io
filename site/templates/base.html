<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec">
  <script src="/assets/js/theme.js"></script>
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="$og_type">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$site_url/images/profile-portrait.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Tarun's notebook" href="/feed.xml">
  <link rel="preload" href="/assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/search.js" defer></script>
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/terminal.js" defer></script>
</head>
<body class="$page_class">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="brand" href="/" aria-label="Tarun Ajjarapu, home">Tarun Ajjarapu<span class="brand-period" aria-hidden="true">.</span></a>
    <nav class="desktop-nav" aria-label="Main navigation">$navigation</nav>
    <div class="header-controls">
      <button class="terminal-launch" type="button" aria-label="Focus terminal" aria-controls="terminal-dock" title="Focus terminal (⌘K / Ctrl+K)" hidden><span aria-hidden="true">&gt;_</span><kbd aria-hidden="true">⌘K</kbd></button>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" hidden>
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav"><span>Menu</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></button>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation" hidden>$navigation<a href="$linkedin" target="_blank" rel="noopener noreferrer">Contact ↗</a></nav>
  </header>
  <main id="main">$content</main>
  $terminal_dock
  <footer class="site-footer wrap">
    <div class="footer-top"><p>$channel_aside</p><a class="text-link" href="$linkedin" target="_blank" rel="noopener noreferrer">Contact <span aria-hidden="true">↗</span></a></div>
    <div class="footer-bottom"><span>© $year Tarun Ajjarapu</span><div class="social-links"><a href="$github" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a href="$linkedin" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>$youtube_footer<a href="/feed.xml" aria-label="Subscribe to the writing RSS feed">RSS ↗</a></div></div>
  </footer>
</body>
</html>
